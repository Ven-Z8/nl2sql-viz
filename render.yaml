# Render blueprint — NL2SQL Viz (DataLens AI)
# Creates: free web service (FastAPI) + free Postgres.
#
# After deploy:
#   1. Set OPENROUTER_API_KEY and SECRET_KEY in the web service's
#      Environment tab (secrets, not plain text).
#   2. Optional: run the seed job once to pre-load all datasets:
#      Render dashboard -> the seed job -> Manual Run.
#   3. Without the seed, the app loads datasets on demand when the
#      frontend calls POST /api/datasets/<id>/load.

services:
  - type: web
    name: nl2sql-viz-api
    runtime: docker
    plan: free
    healthCheckPath: /api/datasets
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nl2sql-viz-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: NL2SQL_MODEL
        value: openrouter/deepseek/deepseek-v4-flash-0731
      - key: NL2SQL_FAST_MODEL
        value: openrouter/inclusionai/ling-3.0-flash

  - type: job
    name: nl2sql-viz-seed
    runtime: docker
    plan: free
    startCommand: python scripts/seed_deploy.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nl2sql-viz-db
          property: connectionString

databases:
  - name: nl2sql-viz-db
    plan: free
